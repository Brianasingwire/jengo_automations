{# Closing call-to-action band used at the bottom of most pages. Pages may set cta_heading. #}
<section class="relative overflow-hidden bg-ink-900">
  <div class="hero-glow absolute inset-0" aria-hidden="true"></div>
  <div class="container-page reveal relative py-20 text-center sm:py-24">
    <h2 class="mx-auto max-w-2xl text-3xl text-white sm:text-4xl">{{ cta_heading or c.cta.heading }}</h2>
    <p class="mx-auto mt-4 max-w-xl text-lg text-slate-300">{{ c.cta.body }}</p>
    <div class="mt-8 flex flex-col justify-center gap-3 sm:flex-row">
      <a href="{{ url_for('main.contact') }}" class="btn-primary">{{ c.cta.primary_button }} {{ icon("arrow-right", "size-4") }}</a>
      <a href="{{ url_for('main.how_it_works') }}" class="btn-ghost-dark">{{ c.cta.secondary_button }}</a>
    </div>
  </div>
</section>
