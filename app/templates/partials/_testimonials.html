{# Testimonial cards. Set `items` (and optionally `dark`) before including. Hidden when empty. #}
{% if items %}
<div class="grid gap-6 {{ 'md:grid-cols-2 lg:grid-cols-3' if items | length > 2 else 'md:grid-cols-2' if items | length == 2 }}">
  {% for t in items %}
  <figure class="card reveal flex flex-col">
    <svg class="size-8 text-brand-200" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M9.3 25.3c-2.2 0-4-.8-5.3-2.3C2.7 21.5 2 19.6 2 17.3c0-2.8.9-5.4 2.6-7.8C6.4 7.1 8.8 5.3 12 4l1.3 2c-2.2 1-3.9 2.2-5 3.7-1.1 1.4-1.6 2.9-1.6 4.4.4-.2 1-.3 1.6-.3 1.6 0 2.9.5 3.9 1.5s1.5 2.3 1.5 3.8c0 1.8-.6 3.3-1.8 4.4-1 1.2-2.6 1.8-4.6 1.8zm16.6 0c-2.2 0-4-.8-5.3-2.3-1.3-1.5-2-3.4-2-5.7 0-2.8.9-5.4 2.6-7.8C23 7.1 25.4 5.3 28.6 4L30 6c-2.2 1-3.9 2.2-5 3.7-1.1 1.4-1.6 2.9-1.6 4.4.4-.2 1-.3 1.6-.3 1.6 0 2.9.5 3.9 1.5s1.5 2.3 1.5 3.8c0 1.8-.6 3.3-1.8 4.4-1.1 1.2-2.7 1.8-4.7 1.8z"/></svg>
    <blockquote class="mt-4 flex-1 text-lg leading-relaxed text-ink-900">“{{ t.quote }}”</blockquote>
    <figcaption class="mt-6 border-t border-slate-100 pt-4">
      <p class="font-semibold text-ink-900">{{ t.name }}</p>
      {% if t.role or t.company %}
      <p class="text-sm text-slate-500">{{ t.role }}{% if t.role and t.company %}, {% endif %}{{ t.company }}</p>
      {% endif %}
    </figcaption>
  </figure>
  {% endfor %}
</div>
{% endif %}
