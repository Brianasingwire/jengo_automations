# =============================================================================
#  JENGO WEBSITE WORDS
#  The words on every page live in this file. Edit the words between the
#  quotes, save, and the site updates.
# =============================================================================
#
#  HOW TO EDIT SAFELY
#  - Only change text inside quotes: "like this". Keep the quotes.
#  - Longer text sits between triple quotes: """like this""". Line breaks
#    inside them don't matter; the website joins the lines into one paragraph.
#  - Lines starting with # are notes (like this one). The website ignores them.
#  - Don't rename anything to the LEFT of an = sign, and don't change a
#    [section name]. The website looks for those exact names.
#  - If a quote mark is part of your text, write \" (for example: \"fast\").
#    Apostrophes are fine as they are: we're, don't, client's.
#  - Lists look like ["one", "two", "three"]. Keep the commas between items.
#
#  AFTER EDITING
#  - Preview: run `make dev` and open http://localhost:5000. Changes show up
#    when you refresh the page.
#  - Check: run `make test`. If you broke something (a missing quote, an
#    unknown icon, a page description that's too long), the message tells you
#    what to fix and where. A broken file also stops the site from starting,
#    so a mistake can never go live. The previous version keeps running.
#  - Search results: page `title`s should be 52 characters or fewer (the site
#    adds " | Jengo") and `description`s 160 or fewer, or Google cuts them off.
#    `make test` checks this for you.
#  - Publish: commit the file. Railway/Render redeploys automatically once it's
#    connected to GitHub. You can also edit this file on github.com directly.
#
#  ICONS: fields called `icon` accept one of these names:
#    workflow, agent, funnel, document, chart, sparkle, check, arrow-right,
#    clock, globe, shield, key, bolt, database, sheet, bell, support, users,
#    calculator, mail, pin
#
#  NOT IN THIS FILE
#  - Contact form questions and dropdown options: app/forms.py and app/leads.py
#    (the dropdowns feed your Make scoring, so they're kept with the code).
#  - The privacy policy: app/templates/pages/privacy.html (legal text, so have
#    changes reviewed).
#  - Your contact email: the CONTACT_EMAIL setting on Railway/Render.
#  - Menu and footer link names ("Services", "About", "Get in touch"...):
#    app/templates/partials/_nav.html and _footer.html.
# =============================================================================


# -----------------------------------------------------------------------------
#  WHOLE SITE
# -----------------------------------------------------------------------------
