location = "Kampala, Uganda"
timezone = "EAT (UTC+3)"
nav_button = "Start a project"
footer_blurb = "AI automation agency based in Kampala, Uganda, building for growing businesses at home and abroad."


# The dark "call to action" band at the bottom of most pages. Pages can
# replace the heading with their own `cta_heading` (see below).
