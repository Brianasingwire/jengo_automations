heading = "Find out what you could automate this month"
body = "Tell us about your workflows. We'll reply within one business day with a view on where automation will pay off."
primary_button = "Start a project"
secondary_button = "See how it works"


# =============================================================================
#  YOUR CLIENTS, TESTIMONIALS AND CASE STUDIES
#  These sections stay HIDDEN on the website until you add at least one entry.
#
#  Only add real clients, with their permission, and quote them word for word.
#  Invented or unapproved social proof can break advertising and consumer law
#  in the UK, EU, US and Uganda, and it damages trust if a prospect checks.
#
#  To add an entry, copy an example block, remove the # at the start of each
#  line, and fill it in. Add `hidden = true` to any entry to keep it off the
#  site while you're waiting for approval.
# =============================================================================

# --- CLIENT LOGOS ------------------------------------------------------------
# Shown as a "trusted by" row on the home page.
# logo: put the image in app/static/img/clients/ and write just its file name.
#       SVG or PNG, ideally on a transparent background. Leave the line out to
#       show the client's name as text instead.
# website: optional; makes the logo a link.
#
# [[clients]]
# name = "Example Coffee Co."
# logo = "example-coffee.svg"
# website = "https://example.com"


# --- TESTIMONIALS ------------------------------------------------------------
# Shown on the home page (first three) and the About page (all of them).
#
# [[testimonials]]
# quote = "Jengo automated our order intake. What took two people a full day now happens on its own."
# name = "Jane Namukasa"
# role = "Operations Manager"
# company = "Example Coffee Co."


# --- CASE STUDIES ------------------------------------------------------------
# Each case study gets its own page at /case-studies/<slug>, is listed on the
# home and How it works pages, and is added to the sitemap for Google.
# slug: the web address, lowercase words with hyphens, e.g. "coffee-order-intake".
#       Don't change it after publishing, or old links will break.
# results: short, specific and true. Numbers the client has approved.
# quote: optional. A line from the client that appears on the case-study page.
#
# [[case_studies]]
# slug = "coffee-order-intake"
# title = "Automating order intake for a Kampala coffee exporter"
# client = "Example Coffee Co."
# industry = "Agriculture & export"
# location = "Kampala, Uganda"
# summary = "Orders from email and WhatsApp now land in one sheet, checked and ready to fulfil."
# challenge = """Orders arrived by email, WhatsApp and phone, and two staff re-typed
# every one into a spreadsheet, which caused delays and mistakes."""
# solution = """We built a Make workflow that reads incoming orders, extracts the details
# with AI, checks them against the price list, and logs them for the warehouse."""
# results = [
#   "Order entry time cut from a full day to minutes",
#   "Typing errors in orders eliminated",
#   "Staff moved to customer follow-up",
# ]
# tools = ["Make", "OpenAI", "Google Sheets", "WhatsApp Business"]
# quote = "What took two people a full day now happens on its own."
# quote_by = "Jane Namukasa, Operations Manager"


