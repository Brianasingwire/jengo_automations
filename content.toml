# -----------------------------------------------------------------------------
#  PROCESS STEPS (shown on the home page and the How it works page)
# -----------------------------------------------------------------------------
[[process]]
name = "Discovery call"
duration = "30 minutes"
body = "We learn how your team works today, where time is lost, and what a win looks like. You leave with an honest view of what's worth automating, even if you don't hire us."

[[process]]
name = "Automation blueprint"
duration = "3–5 days"
body = "A written plan: the workflows, the tools, the edge cases, the expected time saved, and a fixed-price quote. No open-ended hourly billing."

[[process]]
name = "Build & test"
duration = "1–5 weeks"
body = "We build in your accounts, not ours, and share progress every week. Everything is tested against real data and failure cases before it goes live."

[[process]]
name = "Launch & handover"
duration = "1 week"
body = "We go live alongside your team, and you get documentation and a recorded walkthrough of every automation. You own all of it."

[[process]]
name = "Support & improve"
duration = "Ongoing"
body = "Every project includes a post-launch support period. After that, an optional care plan keeps things running and improving."


# -----------------------------------------------------------------------------
#  FREQUENTLY ASKED QUESTIONS (home page)
# -----------------------------------------------------------------------------
[[faqs]]
question = "Do you work with local clients as well as international ones?"
answer = "Yes. We can meet businesses in Kampala in person, and we share a time zone with the rest of East Africa. We also build for local tools and channels, such as WhatsApp Business and mobile money. International clients work with us remotely, and get the same process, pricing structure and standards."

[[faqs]]
question = "How do you work with clients in a different time zone?"
answer = "We're based in Kampala (EAT, UTC+3). That gives us an overlap with most of the UK and European working day, morning overlap with the US East Coast, and afternoon overlap with Australia. Day-to-day we communicate async through Slack or email plus a weekly video update, and we schedule live calls at times that suit you."

[[faqs]]
question = "Who owns the automations and accounts?"
answer = "You do. We build inside your own Make, n8n, CRM and AI provider accounts, and when the project ends you keep everything, including documentation and walkthrough videos."

[[faqs]]
question = "How is pricing structured?"
answer = "Build projects are fixed-price, based on the scope in your automation blueprint, so you know the full cost before we start. Ongoing support is a flat monthly care plan."

[[faqs]]
question = "How do you handle our data and access?"
answer = "We ask for the minimum access each workflow needs, use your own accounts rather than shared credentials, and are happy to sign an NDA or DPA. When the project is done, you can revoke our access in one step."

[[faqs]]
question = "What if an automation breaks after launch?"
answer = "Every automation we build alerts someone when it fails. Fixes are covered during the post-launch support period, and care plan clients get priority fixes as part of their plan."


